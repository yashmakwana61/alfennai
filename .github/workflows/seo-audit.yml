name: SEO Audit

on:
  push:
    branches: [main]
    paths:
      - "config/tools/**"
      - "config/agents/**"
      - "scripts/seo-audit.ts"
  schedule:
    # Every Monday at 06:00 UTC -- catches drift even when nothing was
    # pushed (e.g. after manually editing content, or just as a recurring
    # health check).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run SEO audit
        id: audit
        run: |
          npm run seo:audit > audit-output.txt 2>&1 || echo "AUDIT_FAILED=true" >> "$GITHUB_ENV"
          cat audit-output.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## SEO Audit Results"
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # On the weekly scheduled run, also keep a single persistent issue
      # updated with the latest warnings, so there's a standing checklist
      # of thin-content/short-FAQ pages to work through -- rather than
      # spamming a new issue every week.
      - name: Update tracked SEO issue (scheduled runs only)
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit-output.txt', 'utf8');
            const title = 'Weekly SEO Audit Report';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['seo-audit'],
            });

            const body = `Automated weekly SEO audit, generated by \`.github/workflows/seo-audit.yml\`.\n\n\`\`\`\n${output}\n\`\`\`\n\n_Last updated: ${new Date().toISOString()}_`;

            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['seo-audit'],
              });
            }

      - name: Fail build on real SEO errors
        if: env.AUDIT_FAILED == 'true'
        run: |
          echo "SEO audit found errors (broken internal links or duplicate title/description). See job summary above."
          exit 1
